version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bitwisehide-db
    environment:
      POSTGRES_USER: bitwisehide
      POSTGRES_PASSWORD: bitwisehide_secret
      POSTGRES_DB: bitwisehide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitwisehide"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bitwisehide-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitwisehide-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bitwisehide:bitwisehide_secret@db:5432/bitwisehide
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
    volumes:
      - ./backend:/workspace
      - storage-data:/workspace/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage-data:
